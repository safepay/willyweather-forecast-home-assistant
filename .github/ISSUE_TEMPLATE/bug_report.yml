name: Bug Report
description: Report a bug or issue with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is
      placeholder: When I try to...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      description: Which version of the integration are you using? Shown on the device page.
      placeholder: e.g., 2.4.2
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Which version of Home Assistant are you running? The integration requires 2025.3.0 or newer.
      placeholder: e.g., 2025.3.0
    validations:
      required: true

  - type: input
    id: station
    attributes:
      label: Station
      description: Your station ID or location, and whether it is coastal. Tide and swell sensors need a coastal station.
      placeholder: Station ID or suburb, and coastal or not
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Log output with `custom_components.willyweather` set to debug. Redact your API key before posting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem
